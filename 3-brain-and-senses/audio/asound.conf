# /etc/asound.conf on the head computer: the MAX98357A I2S amplifier behind a -3 dB software volume ceiling.
# With GAIN unconnected (9 dB) a full-scale signal at max_dB -3.0 puts about 0.8 W into the 8 ohm 1 W speaker;
# 0 dB would be 1.6 W. Programs play through the default device, never hw: directly. The card name is the one
# the A7Z image gives the I2S0 card (sndi2s0); on the Raspberry Pi it was MAX98357A (see pi_audio_setup.sh history).
pcm.speakerbonnet { type hw card sndi2s0 }
pcm.dmixer {
  type dmix
  ipc_key 1024
  ipc_perm 0666
  slave { pcm "speakerbonnet" period_time 0 period_size 1024 buffer_size 8192 rate 44100 channels 2 }
}
ctl.dmixer { type hw card sndi2s0 }
pcm.softvol {
  type softvol
  slave.pcm "dmixer"
  control.name "PCM"
  control.card sndi2s0
  min_dB -54.0
  max_dB -3.0
}
ctl.softvol { type hw card sndi2s0 }
pcm.!default { type plug slave.pcm "softvol" }

# /etc/sysctl.d/90-duck-blackbox.conf: make a hung kernel say where it hangs before the watchdog resets the A7Z
# (about 15 s after it stops answering, 2026-10-21). Warnings only: no setting here panics, because a panic stops the
# other CPUs at once and the flight recorder could no longer copy the text. Remove this file to restore the defaults.
# Soft-lockup warning after 2 x 3 s (default 2 x 10 s), with backtraces of every CPU.
kernel.watchdog_thresh = 3
kernel.softlockup_all_cpu_backtrace = 1
kernel.softlockup_panic = 0
# A task stuck in D state is reported after 5 s (default 120 s), every time.
kernel.hung_task_timeout_secs = 5
kernel.hung_task_warnings = -1
kernel.hung_task_panic = 0
kernel.panic_on_oops = 0
# Dirty file data (the brain's printed messages, thermal.log) reaches the card within about 1 s instead of 30 s.
vm.dirty_expire_centisecs = 100
vm.dirty_writeback_centisecs = 100
